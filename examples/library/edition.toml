# Example: "Inkwell", a fictional sync library that also ships a home server.
# Every command is an argv array run directly; a placeholder is always a whole argument.

product = "inkwell"
remote = "origin"
main = "main"

[tags]
final = "v{version}"
prerelease = "v{version}-rc.{n}"
prerelease_files = "base"     # version files say 1.4.0 at v1.4.0-rc.N

[lines]
branch = "release/{line}"
dev_suffix = "dev"            # main builds as X.Y.0-dev
hotfix_branch = "hotfix/{version}"

[verify]
tags_since = "1.0.0"

[[version_files]]
path = "Cargo.toml"
after = "[workspace.package]"
pattern = 'version = "{version}"'

[[version_files]]
path = "Cargo.lock"
after = 'name = "inkwell-core"'
pattern = 'version = "{version}"'

[[version_files]]
path = "js/package.json"
after = '"name": "@inkwell/core",'
pattern = '"version": "{version}"'

[[version_files]]
path = "android/build.gradle.kts"
pattern = 'version = "{version}"'

[platforms.home]

# The JavaScript package. It has no build number: a registry channel records the
# version as its build, so a deploy needs no --build.
[platforms.js]

# The repository is public: pushes are scanned for internal notes first.
[remotes.origin]
public = true

[vars]
# The home server's deploy script on this machine. Set EDITION_VAR_DEPLOY_SCRIPT;
# it is printed by name and never recorded.
deploy_script = ""
# A token that can publish to, and read from, the package registry.
# Set EDITION_VAR_NPM_TOKEN; printed by name, never recorded.
npm_token = ""

[checks.test]
run = ["cargo", "test", "--workspace", "--locked"]

[channels.dev-home]
tier = "dev"
kind = "home"
target = "http://localhost:8080"
platform = "home"
run = ["scripts/package.sh", "--only", "home", "--allow-dirty"]

[channels.staging-home]
tier = "staging"
kind = "home"
target = "https://staging.example.com"
platform = "home"
checks = ["test"]
run = ["{var.deploy_script}", "release", "{commit}"]
env = { HOME_SITE = "staging" }
probe = ["curl", "-fsS", "https://staging.example.com/healthz"]

[channels.production-home]
tier = "prod"
kind = "home"
target = "https://home.example.com"
platform = "home"
approval = "owner"
checks = ["test"]
run = ["{var.deploy_script}", "release", "{commit}"]
env = { HOME_SITE = "production" }
probe = ["curl", "-fsS", "https://home.example.com/healthz"]

# Publishes @inkwell/core from the release tag; its build is its version, so no --build.
# A probe gets no credentials unless it asks: `probe_env = "channel"` lends it the
# channel's env, so it can read the registry with the same token. The checks run on the
# tagged commit's tree, written by Edition, even from a main checkout.
[channels.npm]
tier = "prod"
kind = "registry"
target = "https://registry.npmjs.org"
platform = "js"
checks = ["test"]
run = ["scripts/publish.sh", "npm", "{commit}"]
env = { NPM_TOKEN = "{var.npm_token}" }
probe = ["scripts/publish.sh", "npm", "{commit}", "--verify"]
probe_env = "channel"
